// 精简 CarServer 协议：覆盖 docs/tesla-api-capabilities.md 中列出的状态与控制动作。
// 与 vehicle-command Go SDK 的 car_server.proto / vehicle.proto / common.proto
// 包名、消息名、字段号严格一致；未在此声明的字段解码时会被 protobuf-c 自动跳过。
syntax = "proto3";

package CarServer;

option go_package = "github.com/teslamotors/vehicle-command/pkg/protocol/protobuf/carserver";

// 空消息，用于 oneof 选项（与 vehicle-command common.proto 的 Void 一致）
message Void {}

// ==================== 状态：车辆数据 ====================

// 档位（vehicle.proto ShiftState）
message ShiftState {
    oneof type {
        Void Invalid = 1;
        Void P = 2;
        Void R = 3;
        Void N = 4;
        Void D = 5;
        Void SNA = 6;
    }
}

// 行驶状态（vehicle.proto DriveState）
message DriveState {
    ShiftState shift_state = 1;
    string active_route_destination = 7;
    float active_route_minutes_to_arrival = 8;
    float active_route_miles_to_arrival = 9;
    float active_route_traffic_minutes_delay = 10;
    float active_route_energy_at_arrival = 11;
    uint32 speed = 102;
    int32 power = 103;
    int32 odometer_in_hundredths_of_a_mile = 105;
    float speed_float = 106;
}

// 充电状态（vehicle.proto ChargeState）
message ChargeState {
    message ChargingState {
        oneof type {
            Void Unknown = 1;
            Void Disconnected = 2;
            Void NoPower = 3;
            Void Starting = 4;
            Void Charging = 5;
            Void Complete = 6;
            Void Stopped = 7;
            Void Calibrating = 8;
        }
    }
    message ChargePortLatchState {
        oneof type {
            Void SNA = 1;
            Void Disengaged = 2;
            Void Engaged = 3;
            Void Blocking = 4;
        }
    }
    ChargingState charging_state = 1;
    ChargePortLatchState charge_port_latch = 35;
    int32 charge_limit_soc = 104;
    bool fast_charger_present = 110;
    float battery_range = 111;
    float est_battery_range = 112;
    float ideal_battery_range = 113;
    int32 battery_level = 114;
    int32 usable_battery_level = 115;
    float charge_energy_added = 116;
    int32 charger_voltage = 119;
    int32 charger_actual_current = 121;
    int32 charger_power = 122;
    int32 minutes_to_full_charge = 123;
    int32 charge_rate_mph = 126;
    bool charge_port_door_open = 127;
    int32 charger_phases = 134;
    int32 charge_current_request = 137;
    int32 charge_current_request_max = 138;
    int32 charging_amps = 149;
    float charge_rate_mph_float = 156;
}

// 空调状态（vehicle.proto ClimateState）
message ClimateState {
    message ClimateKeeperMode {
        oneof type {
            Void Unknown = 1;
            Void Off = 2;
            Void On = 3;
            Void Dog = 4;
            Void Party = 5;
        }
    }
    ClimateKeeperMode climate_keeper_mode = 30;
    float inside_temp_celsius = 101;
    float outside_temp_celsius = 102;
    float driver_temp_setting = 103;
    float passenger_temp_setting = 104;
    bool is_front_defroster_on = 107;
    bool is_rear_defroster_on = 108;
    int32 fan_status = 109;
    bool is_climate_on = 110;
    int32 seat_heater_left = 113;
    int32 seat_heater_right = 114;
    int32 seat_heater_rear_left = 115;
    int32 seat_heater_rear_right = 116;
    bool battery_heater = 122;
    bool steering_wheel_heater = 125;
    bool is_preconditioning = 128;
    bool bioweapon_mode_on = 134;
    int32 seat_fan_front_left = 139;
    int32 seat_fan_front_right = 140;
    int32 cabin_overheat_protection = 143;
}

// 闭件状态（vehicle.proto ClosuresState）
message ClosuresState {
    message SunRoofState {
        oneof type {
            Void Unknown = 1;
            Void Calibrating = 2;
            Void Closed = 3;
            Void Open = 4;
            Void Moving = 5;
            Void Vent = 6;
        }
    }
    message DisplayState {
        oneof type {
            Void Off = 1;
            Void Dim = 2;
            Void Accessory = 3;
            Void On = 4;
            Void Driving = 5;
            Void Charging = 6;
            Void Lock = 7;
            Void Sentry = 8;
            Void Dog = 9;
            Void Entertainment = 10;
        }
    }
    message SentryModeState {
        oneof type {
            Void Off = 1;
            Void Idle = 2;
            Void Armed = 3;
            Void Aware = 4;
            Void Panic = 5;
            Void Quiet = 6;
        }
    }
    SunRoofState sun_roof_state = 11;
    DisplayState center_display_state = 15;
    SentryModeState sentry_mode_state = 19;
    bool door_open_driver_front = 101;
    bool door_open_driver_rear = 102;
    bool door_open_passenger_front = 103;
    bool door_open_passenger_rear = 104;
    bool door_open_trunk_front = 105;
    bool door_open_trunk_rear = 106;
    bool window_open_driver_front = 107;
    bool window_open_passenger_front = 108;
    bool window_open_driver_rear = 109;
    bool window_open_passenger_rear = 110;
    int32 sun_roof_percent_open = 112;
    bool locked = 113;
    bool is_user_present = 114;
    bool remote_start = 116;
    bool valet_mode = 117;
    bool valet_pin_needed = 118;
    bool sentry_mode_available = 120;
    uint32 tonneau_state = 23;
    uint32 tonneau_percent_open = 24;
    bool tonneau_in_motion = 25;
}

// 位置状态（vehicle.proto LocationState）
message LocationState {
    float latitude = 101;
    float longitude = 102;
    uint32 heading = 103;
    string location_name = 113;
}

// 胎压状态（vehicle.proto TirePressureState）
message TirePressureState {
    float tpms_pressure_fl = 2;
    float tpms_pressure_fr = 3;
    float tpms_pressure_rl = 4;
    float tpms_pressure_rr = 5;
    bool tpms_hard_warning_fl = 10;
    bool tpms_hard_warning_fr = 11;
    bool tpms_hard_warning_rl = 12;
    bool tpms_hard_warning_rr = 13;
    bool tpms_soft_warning_fl = 14;
    bool tpms_soft_warning_fr = 15;
    bool tpms_soft_warning_rl = 16;
    bool tpms_soft_warning_rr = 17;
    float tpms_rcp_front_value = 18;
    float tpms_rcp_rear_value = 19;
}

// 媒体状态（vehicle.proto MediaState）
message MediaState {
    bool remote_control_enabled = 2;
    string now_playing_artist = 3;
    string now_playing_title = 4;
    float audio_volume = 5;
    float audio_volume_increment = 6;
    float audio_volume_max = 7;
    int32 now_playing_source = 8;
    int32 media_playback_status = 9;
}

// 媒体详情（vehicle.proto MediaDetailState）
message MediaDetailState {
    int32 now_playing_duration = 2;
    int32 now_playing_elapsed = 3;
    string now_playing_source_string = 4;
    string now_playing_album = 5;
    string now_playing_station = 6;
    string a2dp_source_name = 7;
}

// 软件升级状态（vehicle.proto SoftwareUpdateState）
message SoftwareUpdateState {
    message SoftwareUpdateStatus {
        oneof type {
            Void Unknown = 1;
            Void Installing = 2;
            Void Scheduled = 3;
            Void Available = 4;
            Void DownloadingWifiWait = 5;
            Void Downloading = 6;
        }
    }
    SoftwareUpdateStatus status = 1;
    uint64 scheduled_time_ms = 102;
    uint64 warning_time_remaining_ms = 103;
    uint32 expected_duration_sec = 104;
    uint32 download_perc = 105;
    uint32 install_perc = 106;
    string version = 107;
}

// 车辆数据（vehicle.proto VehicleData）
message VehicleData {
    ChargeState charge_state = 3;
    ClimateState climate_state = 4;
    DriveState drive_state = 5;
    LocationState location_state = 8;
    ClosuresState closures_state = 9;
    TirePressureState tire_pressure_state = 19;
    MediaState media_state = 20;
    MediaDetailState media_detail_state = 21;
    SoftwareUpdateState software_update_state = 23;
}

// CarServer 响应（car_server.proto Response）
// 官方把 vehicleData=2 放在 oneof response_msg 里；oneof 在 wire 上与普通字段
// 完全等价，这里按本文件惯例展平，不影响解码。
message Response {
    ActionStatus actionStatus = 1;
    VehicleData vehicleData = 2;
}

// 动作执行结果（car_server.proto ActionStatus / OperationStatus_E / ResultReason）
// result 是 varint 枚举，必须声明成 enum 而不是 message：否则车机带回
// actionStatus 时 protobuf-c 会按 length-delimited 去解，整个 Response 都
// unpack 失败，连 vehicleData 也一并读不到。
enum OperationStatus_E {
    OPERATIONSTATUS_OK = 0;
    OPERATIONSTATUS_ERROR = 1;
}

message ResultReason {
    string plain_text = 1;
}

message ActionStatus {
    OperationStatus_E result = 1;
    ResultReason result_reason = 2;
}

// ==================== 请求侧：读取状态 ====================

message GetChargeState {}
message GetClimateState {}
message GetDriveState {}
message GetLocationState {}
message GetClosuresState {}
message GetTirePressureState {}
message GetMediaState {}
message GetMediaDetailState {}
message GetSoftwareUpdateState {}

// car_server.proto GetVehicleData：一次可请求多个类别
message GetVehicleData {
    GetChargeState getChargeState = 2;
    GetClimateState getClimateState = 3;
    GetDriveState getDriveState = 4;
    GetLocationState getLocationState = 7;
    GetClosuresState getClosuresState = 8;
    GetTirePressureState getTirePressureState = 14;
    GetMediaState getMediaState = 15;
    GetMediaDetailState getMediaDetailState = 16;
    GetSoftwareUpdateState getSoftwareUpdateState = 17;
}

// ==================== 请求侧：控制动作 ====================

message Ping {
    int32 ping_id = 1;
}

message HvacAutoAction {
    bool power_on = 1;
    bool manual_override = 2;
}

message HvacSetPreconditioningMaxAction {
    bool on = 1;
    bool manual_override = 2;
}

message HvacSteeringWheelHeaterAction {
    bool power_on = 1;
}

message HvacBioweaponModeAction {
    bool on = 1;
    bool manual_override = 2;
}

message SetCabinOverheatProtectionAction {
    bool on = 1;
    bool fan_only = 2;
}

message HvacTemperatureAdjustmentAction {
    // 官方 car_server.proto 的嵌套消息：ChangeClimateTemp 必须带 Level{TEMP_MAX}，
    // 只有 driver/passenger 绝对温度而没有 Level 时，部分车机固件会按最低温档处理。
    message Temperature {
        oneof type {
            Void TEMP_UNKNOWN = 1;
            Void TEMP_MIN = 2;
            Void TEMP_MAX = 3;
        }
    }
    float delta_celsius = 1;
    sint32 delta_percent = 2;
    float absolute_celsius = 3;
    Temperature level = 5;
    float driver_temp_celsius = 6;
    float passenger_temp_celsius = 7;
}

message HvacSeatHeaterActions {
    message HvacSeatHeaterAction {
        oneof seat_heater_level {
            Void SEAT_HEATER_UNKNOWN = 1;
            Void SEAT_HEATER_OFF = 2;
            Void SEAT_HEATER_LOW = 3;
            Void SEAT_HEATER_MED = 4;
            Void SEAT_HEATER_HIGH = 5;
        }
        oneof seat_position {
            Void CAR_SEAT_UNKNOWN = 6;
            Void CAR_SEAT_FRONT_LEFT = 7;
            Void CAR_SEAT_FRONT_RIGHT = 8;
            Void CAR_SEAT_REAR_LEFT = 9;
            Void CAR_SEAT_REAR_LEFT_BACK = 10;
            Void CAR_SEAT_REAR_CENTER = 11;
            Void CAR_SEAT_REAR_RIGHT = 12;
            Void CAR_SEAT_REAR_RIGHT_BACK = 13;
            Void CAR_SEAT_THIRD_ROW_LEFT = 14;
            Void CAR_SEAT_THIRD_ROW_RIGHT = 15;
        }
    }
    repeated HvacSeatHeaterAction hvacSeatHeaterAction = 1;
}

message ChargingStartStopAction {
    oneof charging_action {
        Void unknown = 1;
        Void start = 2;
        Void start_standard = 3;
        Void start_max_range = 4;
        Void stop = 5;
    }
}

message ChargingSetLimitAction {
    int32 percent = 1;
}

message SetChargingAmpsAction {
    int32 charging_amps = 1;
}

message ChargePortDoorOpen {}
message ChargePortDoorClose {}

message VehicleControlWindowAction {
    oneof action {
        Void unknown = 2;
        Void vent = 3;
        Void close = 4;
    }
}

message VehicleControlSunroofOpenCloseAction {
    oneof action {
        int32 absolute_level = 1;
        sint32 delta_level = 2;
        Void vent = 3;
        Void close = 4;
        Void open = 5;
    }
}

message VehicleControlFlashLightsAction {}
message VehicleControlHonkHornAction {}

message VehicleControlSetSentryModeAction {
    bool on = 1;
}

message VehicleControlSetValetModeAction {
    bool on = 1;
    string password = 2;
}

message VehicleControlResetValetPinAction {}

message MediaPlayAction {}
message MediaNextTrack {}
message MediaPreviousTrack {}
message MediaNextFavorite {}
message MediaPreviousFavorite {}

message MediaUpdateVolume {
    oneof media_volume {
        sint32 volume_delta = 1;
        float volume_absolute_float = 3;
    }
}

message VehicleControlScheduleSoftwareUpdateAction {
    int32 offset_sec = 1;
}

message VehicleControlCancelSoftwareUpdateAction {}

message SetLowPowerModeAction {
    bool low_power_mode = 1;
}

message SetKeepAccessoryPowerModeAction {
    bool keep_accessory_power_mode = 1;
}

message DrivingSpeedLimitAction {
    bool activate = 1;
    string pin = 2;
}

message DrivingSetSpeedLimitAction {
    double limit_mph = 1;
}

message DrivingClearSpeedLimitPinAction {
    string pin = 1;
}

message VehicleControlSetPinToDriveAction {
    bool on = 1;
    string password = 2;
}

message VehicleControlResetPinToDriveAction {}

message EraseUserDataAction {
    string reason = 1;
}

// 车辆动作（car_server.proto VehicleAction）
message VehicleAction {
    GetVehicleData getVehicleData = 1;
    ChargingSetLimitAction chargingSetLimitAction = 5;
    ChargingStartStopAction chargingStartStopAction = 6;
    DrivingClearSpeedLimitPinAction drivingClearSpeedLimitPinAction = 7;
    DrivingSetSpeedLimitAction drivingSetSpeedLimitAction = 8;
    DrivingSpeedLimitAction drivingSpeedLimitAction = 9;
    HvacAutoAction hvacAutoAction = 10;
    HvacSetPreconditioningMaxAction hvacSetPreconditioningMaxAction = 12;
    HvacSteeringWheelHeaterAction hvacSteeringWheelHeaterAction = 13;
    HvacTemperatureAdjustmentAction hvacTemperatureAdjustmentAction = 14;
    MediaPlayAction mediaPlayAction = 15;
    MediaUpdateVolume mediaUpdateVolume = 16;
    MediaNextFavorite mediaNextFavorite = 17;
    MediaPreviousFavorite mediaPreviousFavorite = 18;
    MediaNextTrack mediaNextTrack = 19;
    MediaPreviousTrack mediaPreviousTrack = 20;
    VehicleControlCancelSoftwareUpdateAction vehicleControlCancelSoftwareUpdateAction = 25;
    VehicleControlFlashLightsAction vehicleControlFlashLightsAction = 26;
    VehicleControlHonkHornAction vehicleControlHonkHornAction = 27;
    VehicleControlResetValetPinAction vehicleControlResetValetPinAction = 28;
    VehicleControlScheduleSoftwareUpdateAction vehicleControlScheduleSoftwareUpdateAction = 29;
    VehicleControlSetSentryModeAction vehicleControlSetSentryModeAction = 30;
    VehicleControlSetValetModeAction vehicleControlSetValetModeAction = 31;
    VehicleControlSunroofOpenCloseAction vehicleControlSunroofOpenCloseAction = 32;
    VehicleControlWindowAction vehicleControlWindowAction = 34;
    HvacBioweaponModeAction hvacBioweaponModeAction = 35;
    HvacSeatHeaterActions hvacSeatHeaterActions = 36;
    SetChargingAmpsAction setChargingAmpsAction = 43;
    Ping ping = 46;
    SetCabinOverheatProtectionAction setCabinOverheatProtectionAction = 50;
    ChargePortDoorClose chargePortDoorClose = 61;
    ChargePortDoorOpen chargePortDoorOpen = 62;
    EraseUserDataAction eraseUserDataAction = 72;
    VehicleControlSetPinToDriveAction vehicleControlSetPinToDriveAction = 77;
    VehicleControlResetPinToDriveAction vehicleControlResetPinToDriveAction = 78;
    SetLowPowerModeAction setLowPowerModeAction = 130;
    SetKeepAccessoryPowerModeAction setKeepAccessoryPowerModeAction = 138;
}

// CarServer 请求动作（car_server.proto Action）
message Action {
    VehicleAction vehicleAction = 2;
}
